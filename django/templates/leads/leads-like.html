<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recife - Hogar y Deco</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            recifeYellow: '#FBC403',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    /* Estilos sutiles para scrollbars horizontales en pantallas pequeñas */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-white text-gray-900 antialiased selection:bg-yellow-200">

  <!-- ==============================================
       1. TOP BAR (Superíndice / Tienda Multi-categoría)
       ============================================== -->
  <header class="w-full border-b border-gray-100 bg-white text-xs text-gray-600">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-8 h-12 flex items-center justify-between">
      
      <!-- Logo Principal Superior -->
      <div class="flex items-center">
        <a href="#" class="text-lg font-bold text-gray-900 tracking-tight">Recife</a>
      </div>

      <!-- Pestañas de categorías principales -->
      <nav class="hidden md:flex items-center space-x-6 text-[13px] font-normal">
        <a href="#" class="hover:text-black transition-colors">Indumentaria</a>
        <a href="#" class="hover:text-black transition-colors">Salud y belleza</a>
        <!-- Activa: Hogar y deco -->
        <a href="#" class="px-4 py-1.5 rounded-full border border-gray-300 text-gray-900 font-medium hover:border-gray-900 transition-all">
          Hogar y deco
        </a>
        <a href="#" class="hover:text-black transition-colors">Papelería y oficina</a>
      </nav>

      <!-- Iconos de previsualización (Escritorio / Móvil) -->
      <div class="flex items-center space-x-3 text-gray-400">
        <button title="Vista desktop" class="p-1 hover:text-gray-800 transition-colors focus:outline-none">
          <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.8">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>
        <button title="Vista smartphone" class="p-1 hover:text-gray-800 transition-colors focus:outline-none">
          <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.8">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ==============================================
       2. HEADER SECUNDARIO / SUB-MENÚ DE LA TIENDA
       ============================================== -->
  <div class="w-full bg-white border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo Destacado de Sección -->
      <div class="flex items-center space-x-8">
        <a href="#" class="text-xl font-black tracking-widest text-[#FBC403] uppercase">
          RECIFE
        </a>

        <!-- Menú de navegación de productos -->
        <nav class="hidden lg:flex items-center space-x-6 text-[12px] font-medium text-gray-700">
          <a href="#" class="hover:text-black transition-colors">¡Últimas unidades!</a>
          <a href="#" class="hover:text-black transition-colors">Mesas</a>
          <a href="#" class="hover:text-black transition-colors">Sillas</a>
          <a href="#" class="hover:text-black transition-colors">Alfombras</a>
          <a href="#" class="hover:text-black transition-colors">Lámparas</a>
          <a href="#" class="hover:text-black transition-colors">Bancos</a>
        </nav>
      </div>

      <!-- Iconos de Acción del Usuario -->
      <div class="flex items-center space-x-5 text-gray-700">
        <!-- Búsqueda -->
        <button class="hover:text-black p-1 transition-colors" title="Buscar">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.75">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Usuario / Cuenta -->
        <button class="hover:text-black p-1 transition-colors" title="Mi Cuenta">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.75">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>

        <!-- Carrito con indicador '0' -->
        <button class="hover:text-black p-1 relative transition-colors" title="Carrito">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.75">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <!-- Badge -->
          <span class="absolute -top-1.5 -right-2 bg-[#FBC403] text-gray-900 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
            0
          </span>
        </button>
      </div>

    </div>
  </div>

  <!-- ==============================================
       3. HERO BANNER DIVIDIDO (Amarillo + Escena Hogar)
       ============================================== -->
  <section class="relative w-full bg-[#f8f7f5] overflow-hidden">
    <div class="grid grid-cols-1 lg:grid-cols-12 min-h-[500px] lg:min-h-[560px]">
      
      <!-- Lado Izquierdo: Bloque Amarillo -->
      <div class="lg:col-span-5 bg-[#FBC403] p-10 sm:p-14 lg:p-20 flex flex-col justify-center select-none">
        
        <!-- Tag superior -->
        <span class="text-[12px] font-bold tracking-[0.2em] text-gray-900 uppercase mb-8">
          OFERTAS EXCLUSIVAS
        </span>

        <!-- Título principal con flecha continua -->
        <h1 class="text-5xl sm:text-6xl lg:text-[72px] font-extrabold leading-[1.05] tracking-tight text-gray-950 mb-6">
          <div class="flex items-center space-x-5">
            <span>Ideas e</span>
            <!-- Flecha horizontal delgada -->
            <svg class="w-16 sm:w-20 lg:w-24 h-6 text-gray-950 flex-shrink-0" fill="none" viewBox="0 0 80 20" stroke="currentColor" stroke-width="2">
              <path d="M0 10H76M68 2l8 8-8 8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="block">inspiración</span>
        </h1>

        <!-- Subtítulo / Descripción -->
        <p class="text-base sm:text-lg font-medium text-gray-900/90 max-w-sm mt-2">
          {{titulo}} {{nombre}} {{apellido}}
        </p>

      </div>

      <!-- Lado Derecho: Imagen de Escena Interiorismo -->
      <div class="lg:col-span-7 relative bg-stone-100 flex items-center justify-center min-h-[360px] lg:min-h-full">
        <!-- Imagen fotográfica de alta resolución similar al sillón mid-century con estructura de madera y cojines negros -->
        <img 
          src="https://images.unsplash.com/photo-1598300042247-d088f8ab3a91?auto=format&fit=crop&w=1600&q=80" 
          alt="Sillón de madera y cuero estilo nórdico moderno" 
          class="w-full h-full object-cover object-center max-h-[640px]"
          onerror="this.src='https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=1600&q=80'"
        />

        <!-- Overlay muy suave si es necesario para balance de contraste -->
        <div class="absolute inset-0 bg-stone-900/5 pointer-events-none"></div>

        <!-- Indicadores de Carousel (Dots centrales en la base de la escena) -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex items-center space-x-2">
          <button class="w-2.5 h-2.5 rounded-full bg-gray-900 focus:outline-none" aria-label="Slide 1"></button>
          <button class="w-2 h-2 rounded-full bg-gray-400 hover:bg-gray-600 transition-colors focus:outline-none" aria-label="Slide 2"></button>
          <button class="w-2 h-2 rounded-full bg-gray-400 hover:bg-gray-600 transition-colors" aria-label="Slide 3"></button>
        </div>

      </div>

    </div>
  </section>

  <!-- ==============================================
       4. BARRA DE CATEGORÍAS CON ICONOS MINIMALISTAS
       ============================================== -->
  <section class="w-full bg-white py-12 border-b border-gray-100 relative">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-10 relative flex items-center">
      
      <!-- Flecha de navegación Izquierda -->
      <button class="absolute left-2 sm:left-4 z-10 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:bg-gray-50 transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Lista Horizontal de Categorías con Iconos Lineales -->
      <div class="w-full flex items-center justify-between space-x-4 sm:space-x-8 overflow-x-auto no-scrollbar px-6 sm:px-10 py-2">

        <!-- 1. Cómodas -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Cómoda / Cajonera -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="6" width="32" height="34" rx="2"></rect>
              <line x1="8" y1="17" x2="40" y2="17"></line>
              <line x1="8" y1="28" x2="40" y2="28"></line>
              <!-- Tiradores -->
              <line x1="20" y1="11.5" x2="28" y2="11.5"></line>
              <line x1="20" y1="22.5" x2="28" y2="22.5"></line>
              <line x1="20" y1="34" x2="28" y2="34"></line>
              <!-- Patas -->
              <line x1="12" y1="40" x2="10" y2="44"></line>
              <line x1="36" y1="40" x2="38" y2="44"></line>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Cómodas</span>
        </a>

        <!-- 2. Lámparas de noche -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Lámpara de mesa -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <!-- Pantalla -->
              <path d="M16 22L20 8H28L32 22Z"></path>
              <!-- Poste / Soporte -->
              <line x1="24" y1="22" x2="24" y2="38"></line>
              <!-- Cuerda / interruptor -->
              <line x1="21" y1="22" x2="21" y2="28"></line>
              <circle cx="21" cy="29" r="1" fill="currentColor"></circle>
              <!-- Base -->
              <line x1="15" y1="38" x2="33" y2="38"></line>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Lámparas de noche</span>
        </a>

        <!-- 3. Sillones -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Sillón -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <!-- Respaldo -->
              <rect x="14" y="8" width="20" height="20" rx="3"></rect>
              <line x1="18" y1="12" x2="18" y2="24"></line>
              <line x1="24" y1="12" x2="24" y2="24"></line>
              <line x1="30" y1="12" x2="30" y2="24"></line>
              <!-- Brazos -->
              <rect x="8" y="20" width="7" height="15" rx="2"></rect>
              <rect x="33" y="20" width="7" height="15" rx="2"></rect>
              <!-- Cojín central -->
              <rect x="15" y="27" width="18" height="8" rx="1.5"></rect>
              <!-- Patas -->
              <line x1="11" y1="35" x2="9" y2="41"></line>
              <line x1="37" y1="35" x2="39" y2="41"></line>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Sillones</span>
        </a>

        <!-- 4. Lámparas (Colgantes) -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Lámpara Colgante / Araña -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="24" y1="5" x2="24" y2="17"></line>
              <!-- Campana superior -->
              <path d="M14 17C14 17 18 19 24 19C30 19 34 17 34 17L36 21H12L14 17Z"></path>
              <!-- 3 Focos colgantes -->
              <line x1="16" y1="21" x2="16" y2="30"></line>
              <circle cx="16" cy="33" r="2.5"></circle>
              
              <line x1="24" y1="21" x2="24" y2="35"></line>
              <circle cx="24" cy="38" r="2.5"></circle>

              <line x1="32" y1="21" x2="32" y2="30"></line>
              <circle cx="32" cy="33" r="2.5"></circle>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Lámparas</span>
        </a>

        <!-- 5. Mesas de noche -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Mesita auxiliar / vitrina de noche -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="10" y="8" width="28" height="28" rx="2"></rect>
              <line x1="24" y1="8" x2="24" y2="36"></line>
              <line x1="20" y1="21" x2="20" y2="23"></line>
              <line x1="28" y1="21" x2="28" y2="23"></line>
              <!-- Patas estilo nórdico -->
              <line x1="14" y1="36" x2="11" y2="42"></line>
              <line x1="34" y1="36" x2="37" y2="42"></line>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Mesas de noche</span>
        </a>

        <!-- 6. Estanterías -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Estantería modular -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="8" width="32" height="32" rx="1.5"></rect>
              <!-- Baldas horizontales -->
              <line x1="8" y1="20" x2="40" y2="20"></line>
              <!-- Divisores -->
              <line x1="24" y1="20" x2="24" y2="40"></line>
              <line x1="18" y1="8" x2="18" y2="20"></line>
              <line x1="30" y1="8" x2="30" y2="20"></line>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Estanterías</span>
        </a>

        <!-- 7. Cuadros -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Cuadro decorativo -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="8" width="32" height="32" rx="2"></rect>
              <circle cx="17" cy="18" r="3.5"></circle>
              <path d="M10 34L20 23L30 34"></path>
              <path d="M26 30L31 25L38 34"></path>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Cuadros</span>
        </a>

        <!-- 8. Puertas / Espejos -->
        <a href="#" class="group flex flex-col items-center min-w-[90px] sm:min-w-[105px] transition-transform duration-200 hover:-translate-y-1">
          <div class="w-14 h-14 flex items-center justify-center mb-3 text-gray-900 group-hover:text-black">
            <!-- Icono Puerta / Espejo de pie -->
            <svg class="w-11 h-11" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="14" y="6" width="20" height="36" rx="2"></rect>
              <circle cx="29" cy="24" r="1.5" fill="currentColor"></circle>
              <line x1="10" y1="42" x2="38" y2="42"></line>
            </svg>
          </div>
          <span class="text-[11px] font-normal text-gray-700 tracking-tight text-center group-hover:text-black">Puertas</span>
        </a>

      </div>

      <!-- Flecha de navegación Derecha -->
      <button class="absolute right-2 sm:right-4 z-10 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:bg-gray-50 transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>

    </div>
  </section>

</body>
</html>
