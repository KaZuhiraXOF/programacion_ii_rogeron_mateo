<!DOCTYPE html>
<html lang="es">   
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Confirmar eliminación</title>
    </head>
    <body>
        <h1>Confirmar eliminación</h1>
        <p>¿Está seguro de que desea eliminar la categoría "{{ categoria.nombre }}"?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Eliminar</button>
            <a href="{% url 'categoria_list' %}">Cancelar</a>
        </form>
    </body>
</html>
