{% extends 'nomina/base.html' %}

{% block title %}Registro de usuario{% endblock %}

{% block content %}
<h2>Registro de nuevo usuario</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
        <button type="submit">Registrarse</button>
        <a href="{% url 'login' %}">Cancelar</a>
    </p>
</form>
{% endblock %}
