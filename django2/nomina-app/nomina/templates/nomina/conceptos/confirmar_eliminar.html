{% extends 'nomina/base.html' %}

{% block title %}Eliminar concepto{% endblock %}

{% block content %}
<h2>Eliminar concepto salarial</h2>
<p>¿Está seguro de que desea eliminar el concepto {{ concepto }}?</p>
<form method="POST">
    {% csrf_token %}
    <p>
        <button type="submit">Eliminar</button>
        <a href="{{ concepto.get_absolute_url }}">Cancelar</a>
    </p>
</form>
{% endblock %}
