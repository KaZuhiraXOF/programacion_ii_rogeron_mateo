{% extends 'nomina/base.html' %}

{% block title %}Eliminar empleado{% endblock %}

{% block content %}
<h2>Eliminar empleado</h2>
<p>¿Está seguro de que desea eliminar al empleado {{ empleado }}?</p>
<form method="POST">
    {% csrf_token %}
    <p>
        <button type="submit">Eliminar</button>
        <a href="{{ empleado.get_absolute_url }}">Cancelar</a>
    </p>
</form>
{% endblock %}
