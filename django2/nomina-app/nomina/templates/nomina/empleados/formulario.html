{% extends 'nomina/base.html' %}

{% block title %}{% if form.instance.pk %}Editar empleado{% else %}Crear empleado{% endif %}{% endblock %}

{% block content %}
<h2>{% if form.instance.pk %}Editar empleado{% else %}Crear empleado{% endif %}</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
        <button type="submit">Guardar empleado</button>
        <a href="{% url 'empleado_list' %}">Cancelar</a>
    </p>
</form>
{% endblock %}
