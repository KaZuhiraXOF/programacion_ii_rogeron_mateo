{% extends 'nomina/base.html' %}

{% block title %}Eliminar rol de pago{% endblock %}

{% block content %}
<h2>Eliminar rol de pago</h2>
<p>¿Está seguro de que desea eliminar el registro {{ rol }}?</p>
<form method="POST">
    {% csrf_token %}
    <p>
        <button type="submit">Eliminar</button>
        <a href="{{ rol.get_absolute_url }}">Cancelar</a>
    </p>
</form>
{% endblock %}
